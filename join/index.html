<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a game - Evil Doll 2</title>
    <link rel="icon" type="image/png" href="/roydevicon.png">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14061f; color: #f5ecd2; font-family: Georgia, serif; text-align: center; }
        .card { max-width: 420px; padding: 28px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .code { display: inline-block; margin: 12px 0 20px; padding: 10px 22px; font-size: 40px; letter-spacing: 6px; color: #ffd36b; border: 2px solid #ffd36b; border-radius: 10px; }
        a.button { display: block; margin: 10px 0; padding: 14px; background: #7a1d9c; color: #fff; text-decoration: none; border-radius: 10px; font-size: 18px; }
        p { color: #c9b9d6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're invited to Evil Doll 2</h1>
        <p>Lobby code</p>
        <div class="code" id="code">----</div>
        <a class="button" id="store" href="#">Get the game</a>
        <p id="note">Already installed? Open Evil Doll 2, go to Online and type the code.</p>
    </div>

    <script>
        var PACKAGE = "com.BonoboGames.EvilDoll2";
        var IOS_URL = "https://apps.apple.com/nl/app/evil-doll-2-scary-horror/id6759792373";
        var STEAM_URL = "https://store.steampowered.com/app/3895090/Evil_Doll_2/";

        // /join/?c=9345  (the code only ever contains letters and digits)
        var code = (new URLSearchParams(location.search).get("c") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 12);
        document.getElementById("code").textContent = code || "----";

        var ua = navigator.userAgent || "";
        var target;
        if (/Android/i.test(ua)) {
            // The Play Store passes "referrer" to the game after the install, which then joins this lobby.
            target = "https://play.google.com/store/apps/details?id=" + PACKAGE +
                (code ? "&referrer=" + encodeURIComponent("lobby=" + code) : "");
        } else if (/iPhone|iPad|iPod/i.test(ua)) {
            target = IOS_URL;
        } else {
            target = STEAM_URL;
        }

        document.getElementById("store").href = target;

        // If Android did not open the app itself (not installed), go to the store.
        if (/Android/i.test(ua) && code) {
            setTimeout(function () { location.href = target; }, 1200);
        }
    </script>
</body>
</html>
